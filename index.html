function coatCol(cz,ch,x,y){
  if(ch==='.')return null;
  if(ch==='k')return cz.k||K;
  if(ch==='i')return cz.i||'#ffb3c8';
  if(ch==='p')return cz.fx==='siam'?'#5a3a30':'#ff7fa6';
  if(ch==='P')return cz.P||'#ffb4c6';
  let c=ch==='o'?cz.o:ch==='O'?cz.O:cz.w;
  if(cz.fx==='calico'&&ch!=='w'){
    if((x-6)**2/20+(y-5)**2/10<1||(x-16)**2/8+(y-16)**2/5<1)c='#f4a24e';
    else if((x-16)**2/12+(y-3)**2/7<1||(x-4)**2/5+(y-15)**2/4<1)c='#3d3643';
  }
  if(cz.fx==='siam'){
    const pt='#7a5646';
    if(y<=3&&(x<=6||x>=15))c=pt;
    if(y>=9&&y<=12&&x>=7&&x<=14)c=ch==='w'?'#a07a64':pt;
    if(y===18&&ch==='w')c=pt;
  }
  return c;
}
const coatCache={};
function catSprite(id){
  if(coatCache[id])return coatCache[id];
  const cz=COATS.find(c=>c.id===id)||COATS[0];
  const c=document.createElement('canvas');c.width=CAT_W;c.height=CAT_H;const x=c.getContext('2d');
  CAT_ROWS.forEach((r,j)=>{for(let i=0;i<r.length;i++){const col=coatCol(cz,r[i],i,j);if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}});
  return coatCache[id]=c;
}
/* tiny pixel art with automatic outline */
function pix(c2,rows,pal,x0,y0,ol){
  if(ol!==false){c2.fillStyle=K;
    rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){if(r[i]==='.')continue;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const r2=rows[j+dy],ch=r2&&r2[i+dx];if(!ch||ch==='.')c2.fillRect(x0+i+dx,y0+j+dy,1,1);}}});}
  rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const col=pal[r[i]];if(col){c2.fillStyle=col;c2.fillRect(x0+i,y0+j,1,1);}}});
}

  for(let j=0;j<4;j++)s.push('.'.repeat(12)+(j===3?'s.s.':(j%2?'SSSS':'ssss'))+'..');return s;})();

/* cat is rendered into a small buffer, then blitted (lets us squash & reuse on menus) */
const CB=document.createElement('canvas');CB.width=46;CB.height=33;const cbx=CB.getContext('2d');
const BOX=12,BOY=11;
function drawEyes(face,look,lk){
  const ec=(EYES.find(e=>e.id===lk.eyes)||EYES[0]).c;
  const cz=COATS.find(c=>c.id===lk.coat)||COATS[0];
  const P=(x,y,w,h,col)=>{cbx.fillStyle=col;cbx.fillRect(BOX+x,BOY+y,w,h);};
  for(let s=0;s<2;s++){
    const ex=s?14:6,ey=6,col=ec[s];
    if(face==='blink'){P(ex,ey+2,2,1,K);continue;}
    if(face==='angel'||face==='happy'||face==='eat'){P(ex,ey+1,2,1,K);P(ex-1,ey+2,1,1,K);P(ex+2,ey+2,1,1,K);continue;}
    if(face==='push'){P(ex,ey+1,2,2,K);P(s?ex+1:ex-1,ey-1,2,1,K);continue;}
    if(face==='shock'||face==='crazy'||face==='hunt'){
      P(ex-1,ey-1,4,4,'#fff');
      if(face==='shock')P(ex,ey,2,2,K);
      else if(face==='crazy'){const k=(Math.floor(T*10)+s*2)%4;P(ex-1+[0,2,2,0][k],ey-1+[0,0,2,2][k],2,2,K);}
      else P(ex-1+(look&&look.x>11?2:0),ey-1+(look&&look.y>7?2:0),2,2,K);
      continue;
    }
    // idle / sad: the original tall bead eyes, with a hint of colour
    P(ex,ey,2,3,K);P(ex,ey+1,2,1,col);P(ex,ey,1,1,'#fff');
    if(face==='sad'){P(ex+1,ey+1,1,1,'#fff');P(ex+(s?2:-1),ey+3,1,2,'#8fd3ff');}
  }
  if(face==='shock'){P(9,10,4,2,cz.w);P(10,10,2,2,K);
    for(const [dx,dy] of [[1,3],[0,9],[1,15],[20,4],[21,10],[20,16],[8,-1],[13,-1]])P(dx,dy,1,1,cz.k||K);}
}
function renderCat(face,o){
  o=o||{}; const lk=o.lk||SAVE;
  cbx.clearRect(0,0,CB.width,CB.height);
  const cz=COATS.find(c=>c.id===lk.coat)||COATS[0], kk=cz.k||K;
  const sp=o.tail||5, pts=[];
  for(let i=0;i<8;i++)pts.push([BOX+3-Math.round(i*1.1),BOY+16-Math.round(i*1.5+Math.sin(T*sp+i*0.6)*i*0.45)]);
  cbx.fillStyle=kk;for(const p of pts)cbx.fillRect(p[0]-1,p[1]-1,4,4);
  pts.forEach((p,i)=>{cbx.fillStyle=cz.fx==='siam'&&i>4?'#7a5646':cz.fx==='calico'&&i>5?'#f4a24e':(i%3===2?cz.O:cz.o);cbx.fillRect(p[0],p[1],2,2);});
  cbx.drawImage(catSprite(cz.id),BOX,BOY);
  drawEyes(face,o.look,lk);
  const nk=lk.neck;
  if(nk==='bell'){cbx.fillStyle='#ff5a7a';cbx.fillRect(BOX+3,BOY+12,16,1);
    pix(cbx,['.gg.','gggg','gGGg'],{g:'#ffd84d',G:'#c98a1c'},BOX+9,BOY+13);}
  else if(ACC[nk]){const A=ACC[nk];pix(cbx,A.rows,A.pal,BOX+A.x,BOY+A.y,A.ol);}
  const hd=ACC[lk.head]; if(hd)pix(cbx,hd.rows,hd.pal,BOX+hd.x,BOY+hd.y);
  if(face==='angel'){
    const hy=BOY+(hd&&lk.head!=='bow'&&lk.head!=='flower'?-9:-5)+(Math.floor(T*3)%2);
    cbx.fillStyle='#ffe14d';cbx.fillRect(BOX+6,hy,10,1);cbx.fillRect(BOX+5,hy+1,1,1);cbx.fillRect(BOX+16,hy+1,1,1);cbx.fillRect(BOX+6,hy+2,10,1);
    cbx.fillStyle='#fff6b0';cbx.fillRect(BOX+8,hy,3,1);
  }
}
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');f((X,Y,W,H,col)=>{x.fillStyle=col;x.fillRect(X,Y,W,H);});return c;}

let SND_BUF=null, lastMeow='';
function loadCatSounds(){
  SND_BUF={};
  for(const k in SND_SRC){try{
    const b64=SND_SRC[k].split(',')[1],bin=atob(b64),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    AC.decodeAudioData(u.buffer,buf=>{SND_BUF[k]=buf;},()=>{});
  }catch(e){}}

function playS(name,vol,rate){
  const c=AC,b=SND_BUF&&SND_BUF[name]; if(!c||muted)return true; if(!b)return false;
  const s=c.createBufferSource(),g=c.createGain(); s.buffer=b;
  s.playbackRate.value=(rate||1)*(0.93+Math.random()*0.14); g.gain.value=vol==null?0.4:vol;
  s.connect(g).connect(c.destination); s.start(); return true;
}
function tone(f1,f2,dur,type,vol){
  const c=AC; if(!c||muted)return; const t=c.currentTime;
  const o=c.createOscillator(),g=c.createGain(); o.type=type||'square';
  o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol||0.06,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur,vol,freq,type){
  const c=AC; if(!c||muted)return;
  const b=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=type||'highpass';f.frequency.value=freq;
  const g=c.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(c.destination);s.start();
}
function meow(kind){
  if(kind==='sad'){if(playS('meow_sad',0.38))return;}
  else if(kind==='yowl'){if(playS('meow_yowl',0.42,1.05))return;}
  else{const opts=['meow1','meow2','meow3','meow4'].filter(m=>m!==lastMeow),m=pick(opts);
    if(playS(m,0.4,kind==='excited'?1.15:1)){lastMeow=m;return;}}
  const c=AC; if(!c||muted)return; const t=c.currentTime;
  const o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();
  o.type='sawtooth'; f.type='lowpass'; f.frequency.value=1800;
  const base=kind==='sad'?380:kind==='yowl'?820:520, len=kind==='yowl'?0.6:0.42;
  o.frequency.setValueAtTime(base,t); o.frequency.linearRampToValueAtTime(base*1.7,t+0.12); o.frequency.linearRampToValueAtTime(base*(kind==='sad'?0.7:1),t+len);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.09,t+0.05); g.gain.exponentialRampToValueAtTime(0.0008,t+len+0.03);
  o.connect(f).connect(g).connect(c.destination); o.start(t); o.stop(t+len+0.1);
}

function update(dt){
  T+=dt;
  for(const f of flakes){f.y+=f.v*dt;f.x+=Math.sin(T+f.v)*dt*3;if(f.y>93){f.y=31;f.x=rand(113,165);}}

  for(let i=uiSparks.length-1;i>=0;i--){const p=uiSparks[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.life)uiSparks.splice(i,1);}

  if(state!=='play'){const c=G.cat;c.blink-=dt;if(c.blink<-0.12)c.blink=rand(2,4);if(c.faceT>0)c.faceT-=dt;return;}
  const g=G,o=g.owner,c=g.cat; g.t+=dt; g.hint-=dt;
  const diff=diffNow();
  if(g.ending>0){g.ending-=dt;if(g.ending<=0){state='over';overT=0;
    g.fishGain=Math.floor(g.score/15)+g.broken; SAVE.fish+=g.fishGain; SAVE.skill=SAVE.skill*0.4+g.skill*0.6; persist();

  if(g.banner){g.banner.t-=dt;if(g.banner.t<=0)g.banner=null;}

  /* events */
  if(!g.ev&&!g.banner&&g.ending<=0&&!g.forceNext){
    g.evT-=dt;
    if(g.evT<=0)startEvent(pick(EVENTS.filter(e=>e!==g.lastEv)));
  }
  updateEvent(dt);
  const ev=g.ev, frozen=g.banner||(ev&&(ev.type==='blackout'||ev.type==='laser'));

  /* owner */
  o.t-=dt; if(o.sayT>0)o.sayT-=dt;
  const gr=o.who==='granny';
  if(!frozen){
    if(o.st==='back'){
      if(o.sayT<=0&&Math.random()<dt*0.06)say(gr?'хррр…':pick(mood().idle&&Math.random()<0.5?mood().idle:room().idle),1.6);
      if(o.t<=0){o.st='turn';o.t=gr?0.8:Math.max(0.3,(0.9-diff*0.5)*mood().warn);o.fake=Math.random()<(gr?0.35:mood().fake);sfx.hm();}
    }else if(o.st==='turn'){
      if(o.t<=0){
        if(o.fake){o.st='back';o.t=rand(1.2,3)*mood().back;say(gr?'хррр…':'…а, здалося',1.2);if(g.pose&&g.pose.early)g.pose.early=false;}
        else{o.st='look';o.t=gr?rand(1.4,2.2):(rand(1,1.9)+diff*0.6)*mood().look;o.clean=true;o.lookPoses=0;if(g.pose)scorePose();
          if(g.stats.poses===0&&g.level<2)g.charmHint=2.2;}
      }
    }else if(o.st==='look'){
      if(o.t<=0){
        o.st='back';o.t=gr?rand(2,4.5):backTime();
        if(o.clean&&g.ending<=0){g.score+=5;float('+5 невинність 😇',c.x+11,TABLE_Y-38,'#bfe6ff',7);sfx.angel();
          sparkle(g.sparks,c.x+11,TABLE_Y-24,3,'heart');adjSkill(0.025);}

    }
  }

  /* charm */
  if(g.melt>0){g.melt-=dt;o.t=Math.max(o.t,0.6);if(g.melt<=0){o.t=rand(0.8,1.6);float('📸 Фотосесію закінчено',90,150,'#fff',7,1.2);}}
  else if(!g.banner)g.charm=Math.max(0,g.charm-dt*3.5);
  if(g.meltIn>0){g.meltIn-=dt;if(g.meltIn<=0&&g.ending<=0)melt();}

    g.hype-=dt; g.beatT-=dt;
    if(g.beatT<=0){g.beatT=0.14;const f=HYPE_NOTES[g.beat++%8];tone(f,f,0.1,'square',0.025);}
    if(g.hype<=0)float('Валер\'янка вивітрилась',90,160,'#bfe6a8',7,1.4);
  }

  /* cat */
  if(c.swipe>0)c.swipe-=dt; if(c.faceT>0)c.faceT-=dt; if(c.squash>0)c.squash-=dt;
  c.blink-=dt; if(c.blink<-0.12)c.blink=rand(2,4);
  if(c.jy>0||c.jv!==0){c.jy+=c.jv*dt;c.jv-=900*dt;if(c.jy<=0){c.jy=0;c.jv=0;}}
  const it=g.item;
  if(it&&(it.st==='table'||it.st==='drop')&&!inBox&&!g.pose){
    const tx=Math.min(TABLE_EDGE-CAT_W,it.x-PAW);
    c.x+=(tx-c.x)*Math.min(1,dt*(g.hype>0?16:9));
  }
  c.x=Math.max(2,c.x);

  /* item */
  if(!it){
    if(!g.banner){g.spawnT-=dt;if(g.spawnT<=0&&g.ending<=0&&g.roomCount<ROOM_LEN)spawnItem();}
  }else if(it.st==='drop'){
    it.vy+=800*dt;it.y+=it.vy*dt;
    if(it.y>=TABLE_Y-it.h){it.y=TABLE_Y-it.h;if(it.vy>140){it.vy=-it.vy*0.3;sfx.plonk();}else{it.vy=0;it.st='table';}}
  }else if(it.st==='table'){
    it.x+=it.vx*dt; it.vx*=Math.exp(-5*dt); if(Math.abs(it.vx)<1)it.vx=0;
    if(it.x+it.w*0.5>TABLE_EDGE){
      if(it.def.beh==='float'){it.st='float';it.vy=-4;}
      else{it.st='fall';it.vr=2+it.vx*0.05;it.vx=Math.max(it.vx*0.5,18);}
    }
  }else if(it.st==='fall'){
    it.vy+=750*dt;it.x+=it.vx*dt;it.y+=it.vy*dt;it.rot+=it.vr*dt;
    if(it.y+it.h/2>=FLOOR_Y&&it.vy>0)land(it);
    if(g.item===it&&it.x>LW+20)removeItem();
  }else if(it.st==='roll'){
    it.x+=it.vx*dt; it.rot+=it.vx*dt/4;
    if(it.x>LW+20)removeItem();
  }else if(it.st==='float'){
    it.vy=Math.max(-70,it.vy-140*dt); it.y+=it.vy*dt; it.x+=(14+Math.sin(T*3)*12)*dt; it.rot=Math.sin(T*3)*0.2;
    if(it.y<26)popBalloon(it);
  }

  /* room change */
  if(!g.item&&g.roomCount>=ROOM_LEN&&!g.banner&&g.ending<=0&&!inBox)nextRoom();

  /* particles */
  for(let i=g.particles.length-1;i>=0;i--){
    const p=g.particles[i]; p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    const gy=FLOOR_Y+p.gy;
    if(p.y>=gy&&p.vy>0){
      if(p.b<1){p.b++;p.vy*=-0.35;p.vx*=0.5;p.y=gy;}
      else{debris.push({x:Math.round(Math.max(0,Math.min(LW-2,p.x))),y:Math.round(Math.min(LH-2,gy)),c:p.c,s:p.s});g.particles.splice(i,1);}
    }
  }
  if(debris.length>800)debris.splice(0,debris.length-800);
  for(let i=g.floats.length-1;i>=0;i--){const f=g.floats[i];f.t+=dt;f.y-=14*dt;if(f.t>f.life)g.floats.splice(i,1);}
  for(let i=g.sparks.length-1;i>=0;i--){const p=g.sparks[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.life)g.sparks.splice(i,1);}
  if(g.shake>0)g.shake-=dt;
}

  const id=WP[sl.key];if(owned(sl,id))return;const it=sl.list.find(x=>x.id===id);
  if(SAVE.fish>=it.price){SAVE.fish-=it.price;SAVE.owned.push(sl.key+':'+id);SAVE[sl.key]=id;persist();
    sfx.party();later(()=>sfx.trill(),200);toast={t:1.8,s:'Тепер це твоє! 💕'};G.cat.face='happy';G.cat.faceT=1.2;sparkle(uiSparks,90,80,8,'heart');}
  else{toast={t:1.8,s:'Треба ще '+(it.price-SAVE.fish)+' 🐟'};sfx.nope();}
}
function petCat(){if(Math.random()<0.45)meow();else sfx.trill();sfx.purr();G.cat.face='happy';G.cat.faceT=0.9;sparkle(uiSparks,90,96,4,'heart');}

function render(){
  const g=G,ev=g.ev;
  BTN.length=0;
  a.clearRect(0,0,LW,LH);
  drawRoom();drawOwner();drawTable();
  for(const p of props)a.drawImage(p.img,Math.round(p.x),Math.round(p.y));
  for(const d of debris)R(d.x,d.y,d.s,d.s,d.c);
  drawEventsArt();
  if(state==='play')drawCat();
  drawItem();
  for(const p of g.particles)R(p.x,p.y,p.s,p.s,p.c);
  for(const p of g.sparks)drawSpark(p,R);
  if(g.hype>0&&state==='play'){a.fillStyle=`hsla(${(T*260)%360},90%,60%,0.18)`;a.fillRect(0,0,LW,LH);}
  if(ev&&ev.type==='blackout'&&state==='play'){
    a.fillStyle='rgba(6,6,26,0.84)';a.fillRect(0,0,LW,LH);
    const cx=g.cat.ex,cy=g.cat.ey;R(cx+6,cy+7,2,2,'#ffe14d');R(cx+14,cy+7,2,2,'#ffe14d');R(cx+6,cy+7,1,1,'#fff');R(cx+14,cy+7,1,1,'#fff');
    R(41,113,3,5,'rgba(90,209,255,0.6)');
  }
  if(state==='play')drawArtHUD();

  ctx.fillStyle='#1a1028';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.imageSmoothingEnabled=false;
  let sx=0,sy=0; if(g.shake>0&&state==='play'){sx=(Math.random()-0.5)*4*S;sy=(Math.random()-0.5)*4*S;}
  ctx.drawImage(art,OX+sx,OY+sy,LW*S,LH*S);
  lighting();

  if(state==='play'){
    const o=g.owner, M=mood();
    hud();
    if(o.who==='granny'&&o.st==='back'){txt('z',48,90-((T*8)%8),6,'#bfe6ff');txt('Z',53,84-((T*8+4)%8),8,'#bfe6ff');}
    if(o.st==='turn')bubble(o.who==='granny'?'га?':'?',33,92,o.who==='granny'?7:10);
    else if(o.sayT>0)bubble(o.say,33,92,6);
    else if(o.who==='owner'&&o.st==='back')label(M.em,50,97+Math.sin(T*2)*1.2,7,'#000','center',0.85);
    if(o.st==='turn')txt('⚠ ОБЕРТАЄТЬСЯ…',90,36,7,'#ffd23f','center',0.6+0.4*Math.sin(T*20));
    if(o.st==='look')txt(o.who==='granny'?'БАБУСЯ ДИВИТЬСЯ!':'ЗАМРИ!',90,38,o.who==='granny'?10:13,'#ff4d6d','center',1,true);
    let hint=ev?EV_HINT[ev.type]:null;
    if(ev&&ev.type==='box'&&ev.inBox>0)hint='📦 Мене нема. Я коробка.';
    if(g.hype>0)hint='🌀 РЕЖИМ ХАОСУ: сила й очки ×2';
    if(g.item&&g.item.def.beh==='treat'&&g.item.st==='table')hint='🐟 Смаколик! Тапни — з\'їж (+❤)';
    if(hint){rr(4,43.5,172,13,6.5,'rgba(26,16,40,0.62)');txt(hint,90,50,6,'#ffffff','center',0.8+0.2*Math.sin(T*6));}
    for(const f of g.floats)txt(f.txt,f.x,f.y,f.size,f.col,'center',Math.min(1,(f.life-f.t)*3));
    if(g.hint>0&&!g.banner)txt('Тапай по екрану — штовхай!',90,172,7,'#ffffff','center',Math.min(1,g.hint));
    if(g.charmHint>0&&!g.banner)txt('Тисни 💕 — позуй, поки він дивиться!',90,236,7,'#ffc2dc','center',Math.min(1,g.charmHint*2));
    charmButton();
    if(g.banner){
      const b=g.banner,al=Math.max(0,Math.min(1,b.t*2,(2.8-b.t)*4+0.3)),bm=MOODS[b.mood]||MOODS.calm;
      ctx.save();ctx.globalAlpha=al;
      rr(16,90,148,68,9,'rgba(255,247,238,0.97)',K);
      label('РІВЕНЬ '+b.lvl,90,100,7,'#e86a9a');
      txt(b.title,90,114,14,'#ffa64d','center',1,true);
      label(b.sub,90,129,6.5,'#7a4f3a');
      rr(34,137,112,14,7,'#fde6ee');
      label('Господар '+bm.em+' '+bm.name,90,144.5,6.5,'#a0507a');
      ctx.restore();
    }
  }else if(state==='title'){
    ctx.fillStyle='rgba(255,238,226,0.74)';ctx.fillRect(OX,OY,LW*S,LH*S);
    txt('ПИРІЖОК',90,32,30,'#ffa64d','center',1,true);
    txt('проти гравітації',90,54,10,'#fff3dc');
    let gr=ctx.createRadialGradient(X(90),Y(112),4*S,X(90),Y(112),62*S);
    gr.addColorStop(0,'rgba(255,190,215,0.85)');gr.addColorStop(1,'rgba(255,190,215,0)');ctx.fillStyle=gr;ctx.fillRect(X(20),Y(50),140*S,130*S);
    rr(48,152,84,10,5,'#f7b7cb',K);
    const bob=Math.floor(T*2)%2;
    drawCatUI(G.cat.faceT>0?G.cat.face:(G.cat.blink<0?'blink':'idle'),90,60+bob,2.8);
    BTN.push({x:45,y:70,w:90,h:84,fn:petCat});
    for(const p of uiSparks)drawSpark(p,PR);
    label('Тапай — кіт штовхає речі зі столу',90,172,6.5,'#6b4a3a');
    label('Господар дивиться? Замри, будь янголом 😇',90,183,6.2,'#6b4a3a');
    label('💕 Позуй, коли дивиться, — і він розтане',90,194,6.2,'#a0507a');
    button(40,206,100,24,'ГРАТИ ▶','#ff8a5c',start,10);
    button(40,238,100,21,'🎀 ГАРДЕРОБ','#b98ad8',openWardrobe,8);
    rr(42,268,96,16,8,'rgba(255,255,255,0.75)',K,0.6);
    label('🐟 '+SAVE.fish+'   🏆 '+best,90,276.5,7,'#6b4a3a');
    label('Погладь котика 💕',90,296,5.5,'#b08a9a','center',0.6+0.4*Math.sin(T*2));
  }else if(state==='wardrobe'){
    ctx.fillStyle='rgba(255,238,226,0.9)';ctx.fillRect(OX,OY,LW*S,LH*S);
    txt('ГАРДЕРОБ',90,18,17,'#ff9ec4','center',1,true);
    rr(58,28,64,13,6.5,'#fff',K,0.6);label('🐟 '+SAVE.fish,90,35,7,'#3d7bd9');
    let gr=ctx.createRadialGradient(X(90),Y(92),4*S,X(90),Y(92),55*S);
    gr.addColorStop(0,'rgba(200,170,255,0.7)');gr.addColorStop(1,'rgba(200,170,255,0)');ctx.fillStyle=gr;ctx.fillRect(X(20),Y(40),140*S,110*S);
    rr(52,126,76,9,4.5,'#d9c4f5',K);
    drawCatUI(G.cat.faceT>0?G.cat.face:(G.cat.blink<0?'blink':'idle'),90,44,2.6,{lk:WP});
    BTN.push({x:50,y:50,w:80,h:80,fn:petCat});
    for(const p of uiSparks)drawSpark(p,PR);
    SLOTS.forEach((sl,i)=>{
      const y=144+i*30, it=sl.list.find(x=>x.id===WP[sl.key])||sl.list[0], own=owned(sl,it.id);
      label(sl.name,90,y,5.5,'#a0708a');
      button(10,y+4,22,18,'◀','#ffb347',()=>cycle(sl,-1),10);
      button(148,y+4,22,18,'▶','#ffb347',()=>cycle(sl,1),10);
      rr(36,y+4,108,18,9,own?'#ffffff':'#efe2d6',K,0.7);
      if(own)label(it.name+(SAVE[sl.key]===it.id?' ✓':''),90,y+13.5,7,'#4a2c1e');
      else{label('🔒 '+it.name+' · '+it.price+'🐟',90,y+13.5,6.2,SAVE.fish>=it.price?'#2f9a4a':'#9a7a6a');BTN.push({x:36,y:y+4,w:108,h:18,fn:()=>buy(sl)});}
    });
    if(toast)txt(toast.s,90,268,8,'#ff8fb8','center',Math.min(1,toast.t*3));
    else label('Рибки 🐟 даються за кожну гру',90,268,5.8,'#a0708a');
    button(45,280,90,24,'ГОТОВО','#ff8a5c',()=>{state='title';},10);
  }else if(state==='over'){
    ctx.fillStyle='rgba(32,20,52,0.82)';ctx.fillRect(OX,OY,LW*S,LH*S);
    txt('ПИРІЖКА ВИГНАЛИ',90,26,16,'#ffa64d','center',1,true);
    txt('НА БАЛКОН 🥶',90,42,14,'#bfe6ff','center',1,true);
    rr(54,98,72,8,4,'#5a4a7a');
    drawCatUI(G.cat.faceT>0?G.cat.face:'sad',90,48,1.8);
    for(const p of uiSparks)drawSpark(p,PR);
    txt(String(g.score),90,128,30,'#ffe14d','center',1,true);
    txt(newBest?'НОВИЙ РЕКОРД! 🎉':'Рекорд: '+best,90,148,8,newBest?'#7bd389':'#fff3dc');
    const rank=RANKS.find(r=>g.score<r[0])[1];
    txt('Звання: '+rank,90,163,7.5,'#ffb3c1');
    txt('Розбито: '+g.broken+' · '+room().emoji+' рівень '+(g.level+1),90,176,6.5,'#fff3dc');
    rr(36,186,108,16,8,'rgba(255,255,255,0.12)','#8fd3ff',0.6);
    txt('+'+g.fishGain+' 🐟  (усього '+SAVE.fish+')',90,194.5,7,'#8fd3ff');
    if(overT>0.8){
      button(40,214,100,24,'ЩЕ РАЗ ▶','#ff8a5c',start,10);
      button(40,246,100,21,'🎀 ГАРДЕРОБ','#b98ad8',openWardrobe,8);
      label('Погладь його — він не винен 🥺',90,282,6,'#cdb8e8');
      BTN.push({x:55,y:60,w:70,h:50,fn:petCat});
    }
  }
}

/* ================= INPUT & LOOP ================= */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); ac();
  const lx=(e.clientX*DPR-OX)/S, ly=(e.clientY*DPR-OY)/S;
  if(state!=='play'){
    if(state==='over'&&overT<0.8)return;
    for(let i=BTN.length-1;i>=0;i--){const b=BTN[i];if(lx>=b.x&&lx<=b.x+b.w&&ly>=b.y&&ly<=b.y+b.h){b.fn();return;}}
    return;
  }
  if(lx>152&&ly>292){muted=!muted;return;}
  if(lx<38&&ly>283){charm();return;}
  tap(lx,ly);
},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  if(e.code==='Escape'&&state==='wardrobe'){state='title';return;}
  if((e.code==='KeyC'||e.code==='ArrowDown'||e.code==='ShiftLeft')&&state==='play'){ac();charm();return;}
  if(e.code==='Space'||e.code==='Enter'){ac();if(state==='play')tap(-99,-99);else if(state==='wardrobe')state='title';else if(state==='title'||(state==='over'&&overT>0.8))start();}});
window.__pz={step:dt=>{update(dt);render();},SAVE:()=>SAVE,wardrobe:openWardrobe,cat:(f,lk)=>{renderCat(f,{lk});return CB;},G:()=>G,ev:t=>startEvent(t),next:()=>{G.roomCount=ROOM_LEN;G.item=null;},st:()=>state,charm:()=>charm(),upd:dt=>update(dt),snd:()=>{ac();return {meow,sfx,petCat,buf:()=>SND_BUF};}};

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!document.hidden)update(dt);
  render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
