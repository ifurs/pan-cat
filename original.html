/* ================= AUDIO ================= */
let AC=null, muted=false;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}
function tone(f1,f2,dur,type,vol){
  const c=AC; if(!c||muted)return; const t=c.currentTime;
  const o=c.createOscillator(),g=c.createGain(); o.type=type||'square';
  o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol||0.06,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur,vol,freq,type){
  const c=AC; if(!c||muted)return;
  const b=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=type||'highpass';f.frequency.value=freq;
  const g=c.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(c.destination);s.start();
}
function meow(kind){
  const c=AC; if(!c||muted)return; const t=c.currentTime;
  const o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();
  o.type='sawtooth'; f.type='lowpass'; f.frequency.value=1800;
  const base=kind==='sad'?380:kind==='yowl'?820:520, len=kind==='yowl'?0.6:0.42;
  o.frequency.setValueAtTime(base,t); o.frequency.linearRampToValueAtTime(base*1.7,t+0.12); o.frequency.linearRampToValueAtTime(base*(kind==='sad'?0.7:1),t+len);

/* ================= UPDATE ================= */
function update(dt){
  T+=dt;
  for(const f of flakes){f.y+=f.v*dt;f.x+=Math.sin(T+f.v)*dt*3;if(f.y>93){f.y=31;f.x=rand(113,165);}}
  if(state==='over')overT+=dt;
  if(state!=='play'){G.cat.blink-=dt;if(G.cat.blink<-0.12)G.cat.blink=rand(2,4);return;}
  const g=G,o=g.owner,c=g.cat; g.t+=dt; g.hint-=dt;
  const diff=diffNow();
  if(g.ending>0){g.ending-=dt;if(g.ending<=0){state='over';overT=0;if(g.score>best){best=g.score;newBest=true;try{localStorage.setItem('pyrizhok_best',best);}catch(e){}}}}
  if(g.banner){g.banner.t-=dt;if(g.banner.t<=0)g.banner=null;}

  /* events */
  if(!g.ev&&!g.banner&&g.ending<=0&&!g.forceNext){
    g.evT-=dt;
    if(g.evT<=0)startEvent(pick(EVENTS.filter(e=>e!==g.lastEv)));
  }
  updateEvent(dt);
  const ev=g.ev, frozen=g.banner||(ev&&(ev.type==='blackout'||ev.type==='laser'));

  /* owner */
  o.t-=dt; if(o.sayT>0)o.sayT-=dt;
  const gr=o.who==='granny';
  if(!frozen){
    if(o.st==='back'){
      if(o.sayT<=0&&Math.random()<dt*0.06)say(gr?'хррр...':pick(room().idle),1.6);
      if(o.t<=0){o.st='turn';o.t=gr?0.8:0.9-diff*0.5;o.fake=Math.random()<(gr?0.35:0.22);sfx.hm();}
    }else if(o.st==='turn'){
      if(o.t<=0){
        if(o.fake){o.st='back';o.t=rand(1.2,3);say(gr?'хррр...':'...а, здалося',1.2);}
        else{o.st='look';o.t=gr?rand(1.4,2.2):rand(1,1.9)+diff*0.6;o.clean=true;}
      }
    }else if(o.st==='look'){
      if(o.t<=0){
        o.st='back';o.t=gr?rand(2,4.5):Math.max(1,rand(1.6,4)-diff*1.2);
        if(o.clean&&g.ending<=0){g.score+=5;float('+5 невинність 😇',c.x+10,TABLE_Y-34,'#bfe6ff',7);sfx.angel();}
      }
    }else if(o.st==='angry'){
      if(o.t<=0){o.st='back';o.t=rand(1.5,3);}
    }
  }

  /* boredom */
  const inBox=ev&&ev.type==='box'&&ev.inBox>0;
  if(o.st!=='angry'&&!g.banner&&!inBox&&!(ev&&ev.type==='laser')&&g.ending<=0){
    g.bored+=dt*(6.5+diff*5);
    if(g.bored>=100){g.bored=35;float('НУДЬГА! −1 ❤',90,150,'#ff5c5c',10,1.6);meow('sad');g.shake=0.25;loseLife();}
  }

  /* hype */
  if(g.hype>0){
    g.hype-=dt; g.beatT-=dt;
    if(g.beatT<=0){g.beatT=0.14;const f=HYPE_NOTES[g.beat++%8];tone(f,f,0.1,'square',0.025);}
    if(g.hype<=0)float('Валер\'янка вивітрилась',90,160,'#bfe6a8',7,1.4);
  }

  /* cat */
  if(c.swipe>0)c.swipe-=dt; if(c.faceT>0)c.faceT-=dt;
  c.blink-=dt; if(c.blink<-0.12)c.blink=rand(2,4);
  if(c.jy>0||c.jv!==0){c.jy+=c.jv*dt;c.jv-=900*dt;if(c.jy<=0){c.jy=0;c.jv=0;}}
  const it=g.item;
  if(it&&(it.st==='table'||it.st==='drop')&&!inBox){
    const tx=Math.min(TABLE_EDGE-22,it.x-19);
    c.x+=(tx-c.x)*Math.min(1,dt*(g.hype>0?16:9));
  }
  c.x=Math.max(2,c.x);

  /* item */
  if(!it){
    if(!g.banner){g.spawnT-=dt;if(g.spawnT<=0&&g.ending<=0&&g.roomCount<ROOM_LEN)spawnItem();}
  }else if(it.st==='drop'){
    it.vy+=800*dt;it.y+=it.vy*dt;
    if(it.y>=TABLE_Y-it.h){it.y=TABLE_Y-it.h;if(it.vy>140){it.vy=-it.vy*0.3;sfx.plonk();}else{it.vy=0;it.st='table';}}
  }else if(it.st==='table'){
    it.x+=it.vx*dt; it.vx*=Math.exp(-5*dt); if(Math.abs(it.vx)<1)it.vx=0;
    if(it.x+it.w*0.5>TABLE_EDGE){
      if(it.def.beh==='float'){it.st='float';it.vy=-4;}
      else{it.st='fall';it.vr=2+it.vx*0.05;it.vx=Math.max(it.vx*0.5,18);}
    }
  }else if(it.st==='fall'){
    it.vy+=750*dt;it.x+=it.vx*dt;it.y+=it.vy*dt;it.rot+=it.vr*dt;
    if(it.y+it.h/2>=FLOOR_Y&&it.vy>0)land(it);
    if(g.item===it&&it.x>LW+20)removeItem();
  }else if(it.st==='roll'){
    it.x+=it.vx*dt; it.rot+=it.vx*dt/4;
    if(it.x>LW+20)removeItem();
  }else if(it.st==='float'){
    it.vy=Math.max(-70,it.vy-140*dt); it.y+=it.vy*dt; it.x+=(14+Math.sin(T*3)*12)*dt; it.rot=Math.sin(T*3)*0.2;
    if(it.y<26)popBalloon(it);
  }

  /* room change */
  if(!g.item&&g.roomCount>=ROOM_LEN&&!g.banner&&g.ending<=0&&!inBox)nextRoom();

  /* particles */
  for(let i=g.particles.length-1;i>=0;i--){
    const p=g.particles[i]; p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    const gy=FLOOR_Y+p.gy;
    if(p.y>=gy&&p.vy>0){
      if(p.b<1){p.b++;p.vy*=-0.35;p.vx*=0.5;p.y=gy;}
      else{debris.push({x:Math.round(Math.max(0,Math.min(LW-2,p.x))),y:Math.round(Math.min(LH-2,gy)),c:p.c,s:p.s});g.particles.splice(i,1);}
    }
  }
  if(debris.length>800)debris.splice(0,debris.length-800);
  for(let i=g.floats.length-1;i>=0;i--){const f=g.floats[i];f.t+=dt;f.y-=14*dt;if(f.t>f.life)g.floats.splice(i,1);}
  if(g.shake>0)g.shake-=dt;
}

  if(it.st==='table'&&it.x+it.w>TABLE_EDGE)rot=Math.sin(T*30)*0.12;
  if(rot){
    a.save();a.translate(Math.round(it.x+it.w/2),Math.round(it.y+it.h/2));a.rotate(rot);
    a.drawImage(it.img,-Math.round(it.w/2),-Math.round(it.h/2));a.restore();
  }else a.drawImage(it.img,Math.round(it.x),Math.round(it.y));
}
function drawEventsArt(){
  const ev=G.ev; if(!ev)return;
  if(ev.type==='box'){
    const bx=3,by=Math.round(ev.by);
    if(ev.inBox>0){a.drawImage(CAT,0,0,22,9,bx,by-8,22,9);}
    R(bx,by,22,15,K);R(bx+1,by+1,20,13,'#c8925a');R(bx+10,by+1,2,13,'#e8c890');
    R(bx-3,by-2,7,2,'#b07a45');R(bx+18,by-2,7,2,'#b07a45');R(bx+3,by+6,5,4,'#e33');R(bx+4,by+7,3,2,'#fff');
  }else if(ev.type==='robot'){
    const rx=Math.round(ev.rx+(ev.spin>0?Math.sin(T*40)*2:0)),ry=FLOOR_Y+22;
    R(rx,ry,18,6,K);R(rx+1,ry+1,16,4,'#4a4f5c');R(rx+2,ry+1,14,1,'#6a7080');
    R(rx+8,ry+2,2,1,ev.spin>0?(Math.floor(T*10)%2?'#ff4d4d':'#ffe14d'):(Math.floor(T*4)%2?'#5ad16a':'#1a5a2a'));
    R(rx+1+(Math.floor(T*12)%3),ry+6,3,1,'#999');
  }else if(ev.type==='cucumber'){
    const x=Math.round(ev.cx),y=TABLE_Y-5;
    R(x,y,13,5,K);R(x+1,y+1,11,3,'#3a8a2a');R(x+3,y+1,1,1,'#7bd389');R(x+7,y+2,1,1,'#7bd389');R(x+10,y+1,1,1,'#7bd389');R(x+1,y+1,1,1,'#2e6b20');
  }else if(ev.type==='laser'){
    const hx=46,hy=117,len=Math.max(1,Math.hypot(ev.dx-hx,ev.dy-hy));
    for(let s=0;s<len;s+=3)R(hx+(ev.dx-hx)*s/len,hy+(ev.dy-hy)*s/len,1,1,'rgba(255,50,50,0.35)');
    const dx=Math.round(ev.dx),dy=Math.round(ev.dy);
    R(dx-3,dy,7,1,'rgba(255,60,60,0.45)');R(dx,dy-3,1,7,'rgba(255,60,60,0.45)');R(dx-1,dy-1,3,3,'#ff2a2a');R(dx,dy,1,1,'#ffd0d0');
  }
}
function heart(x,y,full){
  const c=full?'#ff4d6d':'#5a4060';
  R(x+1,y,2,1,c);R(x+4,y,2,1,c);R(x,y+1,7,2,c);R(x+1,y+3,5,1,c);R(x+2,y+4,3,1,c);R(x+3,y+5,1,1,c);
  if(full)R(x+1,y+1,1,1,'#ffb3c1');
}
function drawArtHUD(){
  a.fillStyle='rgba(27,20,48,0.78)';a.fillRect(0,0,LW,25);
  for(let i=0;i<3;i++)heart(150+i*9,4,i<G.lives);
  R(44,15,80,6,K);
  const w=Math.round(78*Math.min(1,G.bored/100));
  R(45,16,w,4,G.bored>75?(Math.floor(T*8)%2?'#ff4d4d':'#ffb347'):G.bored>45?'#ffb347':'#7bd389');
  for(let i=0;i<ROOM_LEN;i++)R(130+i*6,17,4,3,i<G.roomCount?'#ffe14d':'#4a3a60');
  const mx=162,my=303;
  R(mx,my+3,3,4,'#fff3dc');R(mx+3,my+2,1,6,'#fff3dc');R(mx+4,my+1,1,8,'#fff3dc');
  if(muted){for(let i=0;i<5;i++){R(mx+7+i,my+2+i,1,1,'#ff4d4d');R(mx+11-i,my+2+i,1,1,'#ff4d4d');}}
  else{R(mx+7,my+3,1,4,'#fff3dc');R(mx+9,my+1,1,8,'#fff3dc');}
}

/* ================= TEXT LAYER ================= */
const X=x=>OX+x*S, Y=y=>OY+y*S;
function txt(s,x,y,size,col,align,alpha){
  ctx.save();ctx.globalAlpha=alpha==null?1:Math.max(0,alpha);
  ctx.font=`700 ${size*S}px ${FONT}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=Math.max(2,size*S*0.22);ctx.strokeStyle=K;
  ctx.strokeText(s,X(x),Y(y));ctx.fillStyle=col||'#fff';ctx.fillText(s,X(x),Y(y));ctx.restore();
}
function bubble(s,x,y,size){
  ctx.save();ctx.font=`700 ${size*S}px ${FONT}`;
  const w=ctx.measureText(s).width/S+8,h=size+6;
  const bx=Math.max(2,Math.min(LW-2-w,x-w/2)), by=y-h;
  ctx.fillStyle=K;ctx.fillRect(X(bx-1),Y(by-1),(w+2)*S,(h+2)*S);
  ctx.fillStyle='#fffdf5';ctx.fillRect(X(bx),Y(by),w*S,h*S);
  ctx.fillStyle=K;ctx.fillRect(X(x-2),Y(y),4*S,2*S);ctx.fillStyle='#fffdf5';ctx.fillRect(X(x-1),Y(y-1),2*S,2*S);
  ctx.fillStyle=K;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(s,X(bx+4),Y(by+h/2+0.5));
  ctx.restore();
}
function panel(alpha){ctx.fillStyle=`rgba(20,12,40,${alpha})`;ctx.fillRect(0,0,cv.width,cv.height);}
const EV_HINT={blackout:'⚡ Темно: очки ×2, господар не бачить',laser:'🔴 Тапай по червоній точці!',box:'📦 Тапни на коробку — сховайся!',
  robot:'🤖 Скинь річ просто на пилосос!',grandma:'👵 Бабуся: спіймає — нагодує 🥟'};

function render(){
  const g=G,ev=g.ev;
  a.clearRect(0,0,LW,LH);
  drawRoom();drawOwner();drawTable();
  for(const p of props)a.drawImage(p.img,Math.round(p.x),Math.round(p.y));
  for(const d of debris)R(d.x,d.y,d.s,d.s,d.c);
  drawEventsArt();
  drawCat();drawItem();
  for(const p of g.particles)R(p.x,p.y,p.s,p.s,p.c);
  if(g.hype>0&&state==='play'){a.fillStyle=`hsla(${(T*260)%360},90%,60%,0.18)`;a.fillRect(0,0,LW,LH);}
  if(ev&&ev.type==='blackout'&&state==='play'){
    a.fillStyle='rgba(6,6,26,0.84)';a.fillRect(0,0,LW,LH);
    const cx=g.cat.ex,cy=g.cat.ey;R(cx+6,cy+7,2,2,'#ffe14d');R(cx+14,cy+7,2,2,'#ffe14d');
    R(41,113,3,5,'rgba(90,209,255,0.6)');
  }
  if(state==='play')drawArtHUD();

  ctx.fillStyle='#120c22';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.imageSmoothingEnabled=false;
  let sx=0,sy=0; if(g.shake>0&&state==='play'){sx=(Math.random()-0.5)*4*S;sy=(Math.random()-0.5)*4*S;}
  ctx.drawImage(art,OX+sx,OY+sy,LW*S,LH*S);

  if(state==='play'){
    const o=g.owner;
    txt('★ '+g.score,4,8,9,'#ffe14d','left');
    txt('НУДЬГА',4,18,6,'#fff3dc','left');
    txt(room().emoji+' '+room().name,95,8,6,'#fff3dc');
    if(o.who==='granny'&&o.st==='back'){txt('z',48,90-((T*8)%8),6,'#bfe6ff');txt('Z',53,84-((T*8+4)%8),8,'#bfe6ff');}
    if(o.st==='turn')bubble(o.who==='granny'?'га?':'?',33,92,o.who==='granny'?7:10);
    else if(o.sayT>0)bubble(o.say,33,92,6);
    if(o.st==='turn')txt('⚠ ОБЕРТАЄТЬСЯ...',90,34,7,'#ffd23f','center',0.6+0.4*Math.sin(T*20));
    if(o.st==='look')txt(o.who==='granny'?'БАБУСЯ ДИВИТЬСЯ!':'ЗАМРИ!',90,36,o.who==='granny'?9:12,'#ff4d4d');
    let hint=ev?EV_HINT[ev.type]:null;
    if(ev&&ev.type==='box'&&ev.inBox>0)hint='📦 Мене нема. Я коробка.';
    if(g.hype>0)hint='🌀 РЕЖИМ ХАОСУ: сила й очки ×2';
    if(hint)txt(hint,90,49,6,'#ffffff','center',0.75+0.25*Math.sin(T*6));
    for(const f of g.floats)txt(f.txt,f.x,f.y,f.size,f.col,'center',Math.min(1,(f.life-f.t)*3));
    if(g.hint>0&&!g.banner)txt('Тапай по екрану — штовхай!',90,172,7,'#ffffff','center',Math.min(1,g.hint));
    if(g.banner){
      const b=g.banner,al=Math.min(1,b.t*2,(2.6-b.t)*4+0.3);
      ctx.save();ctx.globalAlpha=Math.max(0,al)*0.75;ctx.fillStyle='#1b1430';ctx.fillRect(0,Y(98),cv.width,52*S);ctx.restore();
      txt('РІВЕНЬ '+b.lvl,90,108,8,'#ffb3c1','center',al);
      txt(b.title,90,124,15,'#ffb347','center',al);
      txt(b.sub,90,140,7,'#fff3dc','center',al);
    }
  }else if(state==='title'){
    panel(0.8);
    txt('ПИРІЖОК',90,40,24,'#ffb347');
    txt('проти гравітації',90,63,10,'#fff3dc');
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(CAT,X(90-33),Y(78+Math.floor(T*2)%2),66*S,60*S);
    txt('Тапай — кіт штовхає речі зі столу',90,158,7,'#ffffff');
    txt('Коли господар обертається —',90,171,7,'#ffffff');
    txt('ЗАМРИ і вдавай янгола 😇',90,184,8,'#bfe6ff');
    txt('А ще нудьга вбиває. Ну, майже.',90,199,6.5,'#ffb3c1');
    txt('4 кімнати · 7 подій · 20+ речей',90,218,7,'#bfe6a8');
    txt('⚡ 🔴 📦 🤖 🥒 👵 🌿',90,232,8,'#fff');
    txt('ТАПНИ, ЩОБ ПОЧАТИ',90,262,10,'#ffe14d','center',0.55+0.45*Math.sin(T*5));
    if(best)txt('Рекорд: '+best,90,284,7,'#fff3dc');
  }else if(state==='over'){
    panel(0.82);
    txt('ПИРІЖКА ВИГНАЛИ',90,46,13,'#ffb347');
    txt('НА БАЛКОН 🥶',90,64,13,'#bfe6ff');
    txt(String(g.score),90,100,26,'#ffe14d');
    txt(newBest?'НОВИЙ РЕКОРД!':'Рекорд: '+best,90,124,8,newBest?'#7bd389':'#fff3dc');
    const rank=RANKS.find(r=>g.score<r[0])[1];
    txt('Звання:',90,148,7,'#ffb3c1');
    txt(rank,90,162,10,'#ffffff');
    txt('Розбито речей: '+g.broken,90,186,7,'#fff3dc');
    txt('Дійшов до: '+room().emoji+' '+room().name+' (рівень '+(g.level+1)+')',90,200,6.5,'#fff3dc');
    if(overT>0.8)txt('ТАПНИ — ЩЕ РАЗ',90,250,10,'#ffe14d','center',0.55+0.45*Math.sin(T*5));
  }
}

/* ================= INPUT & LOOP ================= */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); ac();
  const lx=(e.clientX*DPR-OX)/S, ly=(e.clientY*DPR-OY)/S;
  if(state==='play'&&lx>152&&ly>292){muted=!muted;return;}
  if(state==='title'){start();return;}
  if(state==='over'){if(overT>0.8)start();return;}
  tap(lx,ly);
},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){ac();if(state==='play')tap(-99,-99);else if(state==='title'||(state==='over'&&overT>0.8))start();}});
window.__pz={G:()=>G,ev:t=>startEvent(t),next:()=>{G.roomCount=ROOM_LEN;G.item=null;},st:()=>state};

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!document.hidden)update(dt);
  render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
