# Runs tests/smoke.mjs on every push and PR: the game loads at 375×812, a tap starts a run, saves survive a reload, no console errors.
# Actions are pinned by full commit SHA (from ~/claude/skills/templates/webgame-kit/scaffold/ci.yml).
name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Pinned image: `playwright install-deps` maps packages per Ubuntu release.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Chromium headless shell
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-headless-shell
      - name: Install the Chromium headless shell
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium-headless-shell
      - name: Install its system libraries (browser came from the cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium-headless-shell
      - run: npm test
